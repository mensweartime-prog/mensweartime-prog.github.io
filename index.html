<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesbian.</title>
<style>
  :root{
    --bg: #0d0710;
    --bg-raised: #160c1b;
    --line: #2a1a30;
    --text: #f2eaf4;
    --text-dim: #b39dbc;
    --accent: #ff2f7e;
    --accent-2: #6a5cff;
    --accent-soft: rgba(255,47,126,0.12);
    --font-display: "Playfair Display", Georgia, serif;
    --font-body: "Inter", -apple-system, sans-serif;
    --font-mono: "JetBrains Mono", monospace;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height:100vh;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(255,47,126,0.16), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 10%, rgba(106,92,255,0.14), transparent 60%);
    pointer-events:none;
    z-index:0;
  }

  /* ---------- Header ---------- */
  header{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between;
    padding: 22px 5vw;
    background: rgba(13,7,16,0.85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .logo{
    font-family: var(--font-display);
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    background: linear-gradient(100deg, var(--accent), var(--accent-2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    cursor:pointer;
  }
  .tag{
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--text-dim);
    letter-spacing:0.15em;
    text-transform:uppercase;
  }

  /* ---------- Catalog ---------- */
  .catalog{
    position:relative; z-index:1;
    padding: 6vh 5vw 10vh;
  }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 28px;
  }

  .card{
    cursor:pointer;
    border-radius: 6px;
    overflow:hidden;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
  }
  .card:hover{
    transform: translateY(-6px);
    border-color: var(--accent);
    box-shadow: 0 20px 40px -20px rgba(255,47,126,0.35);
  }
  .card-poster{
    position:relative;
    aspect-ratio: 2/3;
    background: linear-gradient(155deg, #241129, #150a1c 60%);
    display:flex; align-items:flex-end;
    overflow:hidden;
  }
  .card-poster::after{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(0deg, rgba(13,7,16,0.9) 0%, transparent 55%);
  }
  .ep-number{
    position:absolute; top:14px; left:14px;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    color: var(--accent);
    background: rgba(13,7,16,0.6);
    border: 1px solid var(--accent);
    padding: 3px 8px;
    border-radius: 3px;
    z-index:2;
  }
  .card-poster .glyph{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family: var(--font-display);
    font-size: 4.5rem;
    font-weight:700;
    color: rgba(255,255,255,0.06);
  }
  .card-title{
    position:relative; z-index:2;
    padding: 16px;
    font-family: var(--font-display);
    font-size: 1.05rem;
    font-weight: 600;
    line-height: 1.3;
  }
  .card-meta{
    padding: 0 16px 16px;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--text-dim);
    letter-spacing: 0.04em;
  }

  /* ---------- Episode detail ---------- */
  .episode-view{
    display:none;
    position:relative; z-index:1;
    max-width: 920px;
    margin: 0 auto;
    padding: 5vh 5vw 10vh;
  }
  .episode-view.active{ display:block; }
  .catalog.hidden{ display:none; }

  .back-link{
    display:inline-flex; align-items:center; gap:8px;
    font-family: var(--font-mono);
    font-size: 0.75rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color: var(--text-dim);
    text-decoration:none;
    cursor:pointer;
    margin-bottom: 32px;
    transition: color .2s;
  }
  .back-link:hover{ color: var(--accent); }

  .player{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    border-radius: 6px;
    overflow:hidden;
    border: 1px solid var(--line);
    margin-bottom: 32px;
  }
  .player iframe{ width:100%; height:100%; border:0; }

  .ep-header{
    display:flex; align-items:center; gap:14px;
    margin-bottom: 10px;
  }
  .ep-badge{
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 4px 10px;
    border-radius: 3px;
  }
  .episode-view h2{
    font-family: var(--font-display);
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    font-weight: 700;
    margin-bottom: 18px;
  }
  .episode-view .desc{
    color: var(--text-dim);
    line-height: 1.7;
    font-size: 1rem;
    max-width: 65ch;
    margin-bottom: 40px;
  }

  .up-next{
    border-top: 1px solid var(--line);
    padding-top: 28px;
  }
  .up-next h3{
    font-family: var(--font-mono);
    font-size: 0.75rem;
    letter-spacing:0.15em;
    text-transform:uppercase;
    color: var(--text-dim);
    margin-bottom: 18px;
  }

  footer{
    position:relative; z-index:1;
    text-align:center;
    padding: 30px;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--text-dim);
    border-top: 1px solid var(--line);
  }

  @media (max-width:600px){
    header{ padding: 18px 5vw; }
    .catalog{ padding: 4vh 6vw 8vh; }
  }
</style>
</head>
<body>

<header>
  <div class="logo" onclick="showCatalog()">Lesbian.</div>
</header>

<main class="catalog" id="catalog">
  <div class="grid" id="grid"></div>
</main>

<section class="episode-view" id="episode-view">
  <a class="back-link" onclick="showCatalog()">← Back to catalog</a>
  <div class="ep-header">
    <span class="ep-badge" id="ep-badge">EP 01</span>
  </div>
  <h2 id="ep-title">Episode title</h2>
  <div class="player" id="ep-player"></div>
  <p class="desc" id="ep-desc"></p>

  <div class="up-next" id="up-next">
    <h3>Watch next</h3>
    <div class="grid" id="up-next-grid"></div>
  </div>
</section>

<footer>Lesbian. — an independent project · 2026</footer>

<script>
  /* ===========================================================
     ADDING A NEW EPISODE:
     just add a new object to the EPISODES array below.
     Get youtubeId from the video URL: youtube.com/watch?v=XXXXXXXXXXX
     =========================================================== */
  const EPISODES = [
    {
      number: 1,
      title: "From Kindergarten Teacher to Lesbian Life",
      description: "When 26-year-old Britney, a strict and rule-obsessed kindergarten teacher, posts an ad for a roommate, she expects a quiet and orderly person. Instead, she gets Ruby — a chaotic, red-haired freelance illustrator who turns her perfectly scheduled life upside down. What starts as annoyance slowly becomes friendship, then an unexpected kiss on the balcony that changes everything. For the first time, Britney has to choose: keep living safely by her rules, or risk it all for a love she never saw coming. A slow-burn realistic story about breaking personal barriers, self-discovery, and finding courage to follow your heart.",
      youtubeId: "2bKqBidAAK0",
      duration: "~15 min"
    }
  ];

  const grid = document.getElementById('grid');
  const upNextGrid = document.getElementById('up-next-grid');

  function pad(n){ return n.toString().padStart(2,'0'); }

  function cardHTML(ep){
    return `
      <div class="card" onclick="showEpisode(${ep.number})">
        <div class="card-poster">
          <div class="glyph">${pad(ep.number)}</div>
          <span class="ep-number">EP ${pad(ep.number)}</span>
          <div class="card-title">${ep.title}</div>
        </div>
        <div class="card-meta">${ep.duration}</div>
      </div>`;
  }

  function renderCatalog(){
    grid.innerHTML = EPISODES.map(cardHTML).join('');
  }

  function showCatalog(){
    document.getElementById('episode-view').classList.remove('active');
    document.getElementById('catalog').classList.remove('hidden');
    window.scrollTo({top:0, behavior:'smooth'});
    history.replaceState(null, '', '#');
  }

  function showEpisode(number){
    const ep = EPISODES.find(e => e.number === number);
    if(!ep) return;

    document.getElementById('catalog').classList.add('hidden');
    const view = document.getElementById('episode-view');
    view.classList.add('active');

    document.getElementById('ep-badge').textContent = 'EP ' + pad(ep.number);
    document.getElementById('ep-title').textContent = ep.title;
    document.getElementById('ep-desc').textContent = ep.description;
    document.getElementById('ep-player').innerHTML =
      `<iframe src="https://www.youtube.com/embed/${ep.youtubeId}" title="${ep.title}" allowfullscreen></iframe>`;

    const others = EPISODES.filter(e => e.number !== number).slice(0,3);
    upNextGrid.innerHTML = others.map(cardHTML).join('');
    document.getElementById('up-next').style.display = others.length ? '' : 'none';

    window.scrollTo({top:0, behavior:'smooth'});
    history.replaceState(null, '', '#ep-' + number);
  }

  renderCatalog();

  // Deep-link support: site.html#ep-2 opens episode 2 directly (unchanged behavior)
  window.addEventListener('load', () => {
    const hash = location.hash;
    if(hash.startsWith('#ep-')){
      const n = parseInt(hash.replace('#ep-',''), 10);
      if(!isNaN(n)) showEpisode(n);
    }
  });
</script>

</body>
</html>
